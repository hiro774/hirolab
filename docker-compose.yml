version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: backend
    volumes:
      - ./backend:/app
    working_dir: /app
    ports:
      - "8000:8000"
    # command: tail -f /dev/null #初回のみ
    command: bash -c "uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: frontend
    volumes:
      - ./frontend:/app
    working_dir: /app
    ports:
      - "3000:3000"
    # command: tail -f /dev/null #初回のみ
    command: npm run dev
